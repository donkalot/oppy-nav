name: Refresh shop data

on:
  schedule:
    # Weekly, Sunday 15:17 UTC (off the hour to be polite to Overpass/Nominatim)
    - cron: '17 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Scrape + rebuild
        run: python scripts/scrape_all.py

      - name: Commit if changed
        run: |
          git config user.name  "oppy-nav-bot"
          git config user.email "oppy-nav-bot@users.noreply.github.com"
          git add index.html data/salvos_geocoded.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: weekly data refresh"
            git push
          fi

  # A silent red cron is how a scraper break went unnoticed for four weeks. File an
  # issue on failure so it lands somewhere that gets read; reuse one issue per
  # outage rather than opening a fresh one every Sunday.
  notify:
    needs: refresh
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$REPO" --state open --label data-refresh-failure \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Weekly refresh failed again: $RUN_URL"
          else
            gh label create data-refresh-failure --repo "$REPO" \
              --color B60205 --description "Weekly data refresh is failing" 2>/dev/null || true
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "The scheduled refresh failed. Data on the site is now stale and will stay stale until this is fixed." \
              "Run: $RUN_URL" \
              "Most likely cause is an upstream schema change in one of the scrapers - check the \`By source\` line and the per-source error samples in the log.")
            gh issue create --repo "$REPO" --label data-refresh-failure \
              --title "Weekly data refresh is failing" --body "$body"
          fi
