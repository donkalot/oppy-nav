name: Refresh shop data

on:
  schedule:
    # Weekly, Sunday 15:17 UTC (off the hour to be polite to Overpass/Nominatim)
    - cron: '17 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Scrape + rebuild
        run: python scripts/scrape_all.py

      - name: Commit if changed
        run: |
          git config user.name  "oppy-nav-bot"
          git config user.email "oppy-nav-bot@users.noreply.github.com"
          git add index.html data/salvos_geocoded.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: weekly data refresh"
            git push
          fi
