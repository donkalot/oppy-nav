<html lang="en">

<style>
  html, body { margin:0; padding:0; height:100%; font-family: system-ui, sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:340px; box-sizing:border-box; padding:12px; overflow-y:auto; border-right:1px solid #ddd; background:#fafafa; }
  #map { flex:1; }
  h1 { font-size:16px; margin:0 0 8px; }
  .row { margin-bottom:8px; }
  label { display:block; font-size:12px; color:#555; margin-bottom:2px; }
  input, button { width:100%; box-sizing:border-box; padding:6px; font-size:14px; }
  button { background:#2b6cb0; color:white; border:0; padding:8px; margin-top:6px; cursor:pointer; }
  button:disabled { background:#888; }
  .stats { font-size:12px; color:#444; margin:8px 0; }
  .shop { padding:6px 4px; border-bottom:1px solid #eee; font-size:13px; cursor:pointer; }
  .shop:hover { background:#eef4fb; }
  .shop.selected { background:#e6f4ea; border-left:3px solid #38a169; padding-left:6px; }
  .shop .name { font-weight:600; }
  .shop .meta { color:#666; font-size:11px; }
  #support { margin-top:14px; padding:10px 0 4px; border-top:1px solid #eee; font-size:11px; color:#666; text-align:center; }
  #support a { color:#2b6cb0; text-decoration:none; }
  #support a:hover { text-decoration:underline; }
  .shop-toggle { float:right; color:#2b6cb0; font-size:11px; font-weight:400; }
  .shop.selected .shop-toggle { color:#c53030; }
  .buffer-row { display:flex; align-items:center; gap:8px; }
  .buffer-row input[type=range] { flex:1; }
  #status { font-size:12px; color:#888; margin-top:4px; }
  #trip { display:none; border-top:2px solid #ddd; margin-top:10px; padding-top:10px; }
  #trip h2 { font-size:14px; margin:0 0 6px; }
  .trip-stop { padding:4px 6px; font-size:12px; background:#fff7ed; margin-bottom:2px; border-radius:3px; border-left:3px solid #d97706; }
  #tripStats { font-size:12px; color:#444; margin:6px 0; }
  #trip button { background:#d97706; }
  #trip button.gmaps { background:#1a73e8; margin-top:4px; }
  #trip button.secondary { background:#888; margin-top:4px; }
  #filters { display:none; margin-top:8px; padding:8px; background:#f0f4f8; border-radius:4px; }
  #filters .flabel { font-size:11px; font-weight:600; color:#555; margin-bottom:4px; }
  #filters label.chk { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; padding:2px 0; }
  #filters label.chk input { width:auto; }
  #filters .fcount { font-size:11px; color:#888; margin-left:auto; }
  #filters hr { border:0; border-top:1px solid #d5dde6; margin:6px 0; }
  #sheetHandle { display:none; }

  @media (max-width: 768px) {
    #app { flex-direction: column; }
    #map { order: 1; flex: 1 1 auto; min-height: 0; }
    #side {
      order: 2;
      width: 100%;
      border-right: 0;
      border-top: 1px solid #ddd;
      height: var(--sheet-h, 240px);
      max-height: 88vh;
      transition: height 0.22s ease;
      padding: 0 12px 12px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      z-index: 500;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    #side.dragging { transition: none; }
    #sheetHandle {
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      background: #fafafa;
      margin: 0 -12px 8px;
      padding: 12px 12px 10px;
      border-bottom: 1px solid #eee;
      cursor: grab;
      user-select: none;
      touch-action: none;
      z-index: 2;
    }
    #sheetHandle::before {
      content: '';
      display: block;
      width: 44px; height: 5px;
      background: #bbb;
      border-radius: 3px;
    }
    #sheetHandle .htitle, #sheetHandle .hchev { display: none; }
    #side.min > *:not(#sheetHandle) { display: none; }
    #side.min { overflow: hidden; }
    #side:not(.full) #list { display: none; }
    #side:not(.full) #filters { display: none !important; }
    #side h1 { display: none; }
    input, button { font-size: 16px; }  /* prevent iOS zoom */
  }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="sheetHandle"><span class="htitle">Op Shop Corridor</span><span class="hchev">▲</span></div>
    <h1>Op Shop Corridor</h1>
    <div class="row">
      <label>From</label>
      <input id="from" value="Melbourne, VIC">
    </div>
    <div class="row">
      <label>To</label>
      <input id="to" value="Sydney, NSW">
    </div>
    <div class="row">
      <label>Corridor width: <span id="bufLbl">2</span> km</label>
      <div class="buffer-row">
        <input id="buf" type="range" min="0.5" max="10" step="0.5" value="2">
      </div>
    </div>
    <button id="go">Find op shops along route</button>
    <div id="status"></div>
    <div class="stats" id="stats"></div>
    <div id="filters">
      <div class="flabel">Filter by chain</div>
      <div id="chainFilters"></div>
      <hr>
      <label class="chk"><input type="checkbox" id="openNowFilter"> Open now only <span class="fcount" id="openNowCount"></span></label>
    </div>
    <div id="trip">
      <h2>Trip planner</h2>
      <div id="tripStops"></div>
      <div id="tripStats"></div>
      <button id="planBtn" disabled>Plan optimised trip</button>
      <button id="gmapsBtn" class="gmaps" disabled>Open in Google Maps</button>
      <button id="clearTripBtn" class="secondary">Clear selection</button>
      <div id="gmapsNote" class="meta" style="font-size:11px;color:#a35300;margin-top:4px;"></div>
    </div>
    <div id="list"></div>
    <div id="support">
      Free & open source. If it saved you a detour, <a href="https://ko-fi.com/donkware" target="_blank" rel="noopener">buy me a coffee ☕</a>.
    </div>
  </div>
  <div id="map"></div>
</div>

const map = L.map('map').setView([-37.8, 144.96], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OSM contributors',
  maxZoom: 19,
}).addTo(map);

const ENDPOINT_RADIUS_KM = 5;

let routeLayer = null;
let bufferLayer = null;
let shopLayer = null;
let tripLayer = null;

let endpoints = null;
let hits = [];
let selected = [];
let lastOrdered = null;  // reordered stops after last "Plan trip" (null = use selected order)
let routeSummary = '';   // preserved route info for stats line
let filterChains = null; // Set of active chain ids; null before first search
let filterOpenNow = false;

const CHAIN_LABELS = {
  vinnies:'Vinnies', salvos:'Salvos', redcross:'Red Cross', lifeline:'Lifeline',
  anglicare:'Anglicare', sacredheart:'Sacred Heart', bosl:'Brotherhood',
  rspca:'RSPCA', mission:'Mission', endeavour:'Endeavour', rotary:'Rotary',
  independent:'Independent/Other'
};

function status(msg) { document.getElementById('status').textContent = msg; }

async function geocode(q) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
  const r = await fetch(url, { headers: { 'Accept-Language': 'en-AU' }});
  const j = await r.json();
  if (!j.length) throw new Error(`Could not geocode: ${q}`);
  return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) };
}

async function fetchRoute(coords) {
  const path = coords.map(c => `${c.lon},${c.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson`;
  const r = await fetch(url);
  const j = await r.json();
  if (!j.routes || !j.routes.length) throw new Error('No route found');
  return j.routes[0];
}

async function fetchTrip(coords) {
  const path = coords.map(c => `${c.lon},${c.lat}`).join(';');
  const url = `https://router.project-osrm.org/trip/v1/driving/${path}?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson`;
  const r = await fetch(url);
  const j = await r.json();
  if (!j.trips || !j.trips.length) throw new Error('No trip found');
  return { trip: j.trips[0], waypoints: j.waypoints };
}

function toggleSelected(shop) {
  const idx = selected.findIndex(s => s.id === shop.id);
  if (idx >= 0) selected.splice(idx, 1);
  else selected.push(shop);
  renderShopList();
}

function isOpenNow(hrs) {
  if (!hrs) return false;
  const today = DAYS[(new Date().getDay() + 6) % 7];
  const t = hrs[today];
  if (!t) return false;
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  const [oh, om] = t.o.split(':').map(Number);
  const [ch, cm] = t.c.split(':').map(Number);
  return now >= oh*60+om && now < ch*60+cm;
}

function filteredHits() {
  return hits.filter(h => {
    const chainId = h.c || 'independent';
    if (filterChains && !filterChains.has(chainId)) return false;
    if (filterOpenNow && !isOpenNow(h.h)) return false;
    return true;
  });
}

function renderMarkers() {
  if (shopLayer) map.removeLayer(shopLayer);
  const markers = [];
  for (const h of filteredHits()) {
    const m = L.marker([h.y, h.x]);
    m.bindPopup(renderPopup(h));
    m.on('popupopen', () => {
      const link = document.querySelector(`.popup-add[data-id="${h.id}"]`);
      if (link) link.onclick = (ev) => { ev.preventDefault(); toggleSelected(h); m.closePopup(); };
    });
    markers.push(m);
  }
  shopLayer = L.layerGroup(markers).addTo(map);
}

function updateStatsLine() {
  const shown = filteredHits().length;
  const suffix = shown !== hits.length ? ` (of ${hits.length})` : '';
  document.getElementById('stats').textContent =
    `${shown} op shop${shown===1?'':'s'} shown${suffix}${routeSummary ? ' · ' + routeSummary : ''}`;
}

function initFilters() {
  const counts = {};
  for (const h of hits) {
    const c = h.c || 'independent';
    counts[c] = (counts[c] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  filterChains = new Set(sorted.map(([c]) => c));
  filterOpenNow = false;
  const el = document.getElementById('chainFilters');
  el.innerHTML = '';
  for (const [c, n] of sorted) {
    const label = document.createElement('label');
    label.className = 'chk';
    label.innerHTML = `<input type="checkbox" data-chain="${c}" checked> ${CHAIN_LABELS[c] || c} <span class="fcount">(${n})</span>`;
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) filterChains.add(c); else filterChains.delete(c);
      applyFilters();
    });
    el.appendChild(label);
  }
  const openNowChk = document.getElementById('openNowFilter');
  openNowChk.checked = false;
  const openable = hits.filter(h => isOpenNow(h.h)).length;
  document.getElementById('openNowCount').textContent = `(${openable})`;
  document.getElementById('filters').style.display = 'block';
}

function applyFilters() {
  renderMarkers();
  renderShopList();
  updateStatsLine();
}

function renderShopList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const selIds = new Set(selected.map(s => s.id));
  const visible = filteredHits();
  for (const h of visible.slice(0, 200)) {
    const isSel = selIds.has(h.id);
    const div = document.createElement('div');
    div.className = 'shop' + (isSel ? ' selected' : '');
    div.innerHTML = `<div class="name">${h.n} <span class="shop-toggle">${isSel ? '− remove' : '+ add'}</span></div><div class="meta">${(h.d*1000).toFixed(0)}m off route${h.o ? ' · '+h.o : ''}</div>`;
    div.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('shop-toggle')) toggleSelected(h);
      else map.setView([h.y, h.x], 15);
    });
    list.appendChild(div);
  }
  if (visible.length > 200) {
    const more = document.createElement('div');
    more.className = 'meta';
    more.style.padding = '8px 4px';
    more.textContent = `... and ${visible.length - 200} more (showing nearest 200 to route)`;
    list.appendChild(more);
  }
  renderTripPanel();
}

function renderTripPanel() {
  const panel = document.getElementById('trip');
  const stops = document.getElementById('tripStops');
  const planBtn = document.getElementById('planBtn');
  const gmapsBtn = document.getElementById('gmapsBtn');
  const note = document.getElementById('gmapsNote');
  stops.innerHTML = '';
  if (!selected.length) {
    panel.style.display = 'none';
    lastOrdered = null;
    return;
  }
  panel.style.display = 'block';
  selected.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'trip-stop';
    d.textContent = `${i+1}. ${s.n}`;
    stops.appendChild(d);
  });
  planBtn.disabled = !endpoints;
  gmapsBtn.disabled = !endpoints || !selected.length;
  note.textContent = selected.length > 9
    ? `Google Maps allows max 9 stops — first 9 will be used (${selected.length - 9} dropped).`
    : '';
}

function renderPopup(h) {
  const parts = [`<b>${escapeHtml(h.n)}</b>`];
  if (h.o) parts.push(`<i>${escapeHtml(h.o)}</i>`);
  const addr = [h.a, h.s, h.st, h.p].filter(Boolean).join(' ');
  if (addr) parts.push(escapeHtml(addr));
  if (h.ph) parts.push(`\u{1F4DE} ${escapeHtml(h.ph)}`);
  const hoursHtml = renderHours(h.h);
  if (hoursHtml) parts.push(hoursHtml);
  parts.push(`<span style="color:#666;font-size:11px">${(h.d*1000).toFixed(0)}m from route · source: ${h.src}</span>`);
  parts.push(`<a href="#" class="popup-add" data-id="${h.id}">Add to trip</a>`);
  return parts.join('<br>');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABEL = {mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};
function renderHours(hrs) {
  if (!hrs) return '';
  const rows = DAYS.map(d => hrs[d] ? `${DAY_LABEL[d]} ${hrs[d].o}-${hrs[d].c}` : `${DAY_LABEL[d]} closed`);
  if (!rows.some(r => !r.endsWith('closed'))) return '';
  const today = DAYS[(new Date().getDay() + 6) % 7];
  const t = hrs[today];
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  function minsOf(hm) { const [h,m] = hm.split(':').map(Number); return h*60+m; }
  const openNow = t && now >= minsOf(t.o) && now < minsOf(t.c);
  const badge = openNow ? '<span style="color:#137333;font-weight:600">Open now</span>' : '<span style="color:#888">Closed now</span>';
  return `${badge}<br><span style="font-size:11px;color:#555">${rows.join(' · ')}</span>`;
}

document.getElementById('buf').addEventListener('input', (e) => {
  document.getElementById('bufLbl').textContent = e.target.value;
});

document.getElementById('openNowFilter').addEventListener('change', (e) => {
  filterOpenNow = e.target.checked;
  applyFilters();
});

const sheetHandle = document.getElementById('sheetHandle');
const sideEl = document.getElementById('side');
const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
const SHEET_H = {
  min: () => 52,
  peek: () => 240,
  full: () => Math.round(window.innerHeight * 0.85),
};
let sheetState = 'peek';
function setSheetState(s) {
  sheetState = s;
  sideEl.classList.remove('min', 'full');
  if (s === 'min' || s === 'full') sideEl.classList.add(s);
  sideEl.style.setProperty('--sheet-h', SHEET_H[s]() + 'px');
  setTimeout(() => map.invalidateSize(), 240);
}
function nearestSheetState(h) {
  return Object.entries(SHEET_H)
    .map(([k, f]) => [k, Math.abs(f() - h)])
    .sort((a, b) => a[1] - b[1])[0][0];
}
if (isMobile()) setSheetState('peek');

let sheetDrag = null;
sheetHandle.addEventListener('pointerdown', (e) => {
  if (!isMobile()) return;
  sheetDrag = { y: e.clientY, h: SHEET_H[sheetState](), moved: false };
  sheetHandle.setPointerCapture(e.pointerId);
  sideEl.classList.add('dragging');
});
sheetHandle.addEventListener('pointermove', (e) => {
  if (!sheetDrag) return;
  const dy = sheetDrag.y - e.clientY;  // positive = drag up
  if (Math.abs(dy) > 4) sheetDrag.moved = true;
  const newH = Math.min(SHEET_H.full(), Math.max(SHEET_H.min(), sheetDrag.h + dy));
  sideEl.style.setProperty('--sheet-h', newH + 'px');
});
function endSheetDrag() {
  if (!sheetDrag) return;
  sideEl.classList.remove('dragging');
  if (!sheetDrag.moved) {
    const order = ['min', 'peek', 'full'];
    const idx = order.indexOf(sheetState);
    setSheetState(order[(idx + 1) % 3]);
  } else {
    const finalH = parseFloat(sideEl.style.getPropertyValue('--sheet-h'));
    setSheetState(nearestSheetState(finalH));
  }
  sheetDrag = null;
}
sheetHandle.addEventListener('pointerup', endSheetDrag);
sheetHandle.addEventListener('pointercancel', endSheetDrag);

window.addEventListener('resize', () => {
  if (isMobile()) sideEl.style.setProperty('--sheet-h', SHEET_H[sheetState]() + 'px');
  map.invalidateSize();
});

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  selected = [];
  hits = [];
  document.getElementById('list').innerHTML = '';
  document.getElementById('stats').textContent = '';
  document.getElementById('tripStats').textContent = '';
  if (tripLayer) { map.removeLayer(tripLayer); tripLayer = null; }
  try {
    status('Geocoding endpoints...');
    const a = await geocode(document.getElementById('from').value);
    const b = await geocode(document.getElementById('to').value);
    endpoints = { a, b };

    status('Routing...');
    const rt = await fetchRoute([a, b]);
    const line = rt.geometry;

    if (routeLayer) map.removeLayer(routeLayer);
    if (bufferLayer) map.removeLayer(bufferLayer);
    if (shopLayer) map.removeLayer(shopLayer);

    routeLayer = L.geoJSON(line, { style: { color:'#2b6cb0', weight:4 }}).addTo(map);

    const bufKm = parseFloat(document.getElementById('buf').value);
    status(`Building ${bufKm}km corridor + ${ENDPOINT_RADIUS_KM}km endpoints...`);
    const routeBuf = turf.buffer(line, bufKm, { units: 'kilometers' });
    const startPt = turf.point([a.lon, a.lat]);
    const endPt   = turf.point([b.lon, b.lat]);
    const startBuf = turf.buffer(startPt, ENDPOINT_RADIUS_KM, { units: 'kilometers' });
    const endBuf   = turf.buffer(endPt,   ENDPOINT_RADIUS_KM, { units: 'kilometers' });

    bufferLayer = L.layerGroup([
      L.geoJSON(routeBuf, { style: { color:'#2b6cb0', weight:1, fillOpacity:0.08 }}),
      L.geoJSON(startBuf, { style: { color:'#38a169', weight:1, fillOpacity:0.10 }}),
      L.geoJSON(endBuf,   { style: { color:'#38a169', weight:1, fillOpacity:0.10 }}),
    ]).addTo(map);

    status('Filtering op shops...');
    const routeLine = turf.lineString(line.coordinates);
    let idCounter = 0;
    for (const s of SHOPS) {
      const pt = turf.point([s.x, s.y]);
      const inCorridor = turf.booleanPointInPolygon(pt, routeBuf);
      const nearStart  = !inCorridor && turf.distance(pt, startPt, { units:'kilometers' }) < ENDPOINT_RADIUS_KM;
      const nearEnd    = !inCorridor && !nearStart && turf.distance(pt, endPt, { units:'kilometers' }) < ENDPOINT_RADIUS_KM;
      if (inCorridor || nearStart || nearEnd) {
        const detourKm = turf.pointToLineDistance(pt, routeLine, { units: 'kilometers' });
        hits.push({ ...s, id: idCounter++, d: detourKm });
      }
    }
    hits.sort((a, b) => a.d - b.d);

    routeSummary = `corridor ${bufKm}km +${ENDPOINT_RADIUS_KM}km ends · route ${(rt.distance/1000).toFixed(0)}km · ${(rt.duration/60).toFixed(0)}min`;
    initFilters();
    renderMarkers();

    map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

    renderShopList();
    updateStatsLine();
    status('Done.');
  } catch (e) {
    status('Error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('planBtn').addEventListener('click', async () => {
  if (!endpoints || !selected.length) return;
  const btn = document.getElementById('planBtn');
  btn.disabled = true;
  try {
    status(`Planning trip via ${selected.length} stop${selected.length===1?'':'s'}...`);
    const coords = [endpoints.a, ...selected.map(s => ({ lat: s.y, lon: s.x })), endpoints.b];
    const { trip, waypoints } = await fetchTrip(coords);

    if (tripLayer) map.removeLayer(tripLayer);
    tripLayer = L.geoJSON(trip.geometry, { style: { color:'#d97706', weight:5, opacity:0.85 }}).addTo(map);
    map.fitBounds(tripLayer.getBounds(), { padding: [20, 20] });

    const orderedStops = selected
      .map((s, i) => ({ shop: s, wp: waypoints[i + 1].waypoint_index }))
      .sort((a, b) => a.wp - b.wp)
      .map(x => x.shop);
    lastOrdered = orderedStops;

    const stops = document.getElementById('tripStops');
    stops.innerHTML = '';
    orderedStops.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'trip-stop';
      d.textContent = `${i+1}. ${s.n}`;
      stops.appendChild(d);
    });

    document.getElementById('tripStats').textContent =
      `Optimised trip: ${(trip.distance/1000).toFixed(0)}km · ${(trip.duration/60).toFixed(0)}min via ${selected.length} stop${selected.length===1?'':'s'}`;

    status('Trip planned.');
  } catch (e) {
    status('Trip error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('gmapsBtn').addEventListener('click', () => {
  if (!endpoints || !selected.length) return;
  const stops = (lastOrdered || selected).slice(0, 9);
  const origin = `${endpoints.a.lat},${endpoints.a.lon}`;
  const dest = `${endpoints.b.lat},${endpoints.b.lon}`;
  const waypoints = stops.map(s => `${s.y},${s.x}`).join('|');
  const url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&waypoints=${encodeURIComponent(waypoints)}&travelmode=driving`;
  window.open(url, '_blank', 'noopener');
});

document.getElementById('clearTripBtn').addEventListener('click', () => {
  selected = [];
  lastOrdered = null;
  if (tripLayer) { map.removeLayer(tripLayer); tripLayer = null; }
  document.getElementById('tripStats').textContent = '';
  renderShopList();
});
</script>
